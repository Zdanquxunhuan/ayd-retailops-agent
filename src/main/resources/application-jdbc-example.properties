# Copy selected values into environment variables or a git-ignored local config file.
# Do NOT activate a profile named jdbc-example: only localhost stub/test profiles are allowed.
omniops.allowed-store=${RETAILOPS_STORE_ID}
omniops.jdbc.local.mode=jdbc
omniops.jdbc.local.readonly-account-confirmed=true
omniops.jdbc.local.store-id=${RETAILOPS_STORE_ID}
omniops.jdbc.local.url=${RETAILOPS_LOCAL_DB_URL}
omniops.jdbc.local.username=${RETAILOPS_LOCAL_DB_USER}
omniops.jdbc.local.password=${RETAILOPS_LOCAL_DB_PASSWORD}
omniops.jdbc.pos.mode=jdbc
omniops.jdbc.pos.readonly-account-confirmed=true
omniops.jdbc.pos.store-id=${RETAILOPS_STORE_ID}
omniops.jdbc.pos.branch-no=${RETAILOPS_POS_BRANCH_NO}
omniops.jdbc.pos.url=${RETAILOPS_POS_DB_URL}
omniops.jdbc.pos.username=${RETAILOPS_POS_DB_USER}
omniops.jdbc.pos.password=${RETAILOPS_POS_DB_PASSWORD}
