spring.application.name=ayd-retailops-agent
server.address=127.0.0.1
server.port=8080
spring.profiles.default=stub
omniops.data-dir=./data/tasks
omniops.allowed-store=A001
omniops.model.provider=stub
omniops.model.endpoint=https://api.deepseek.com/chat/completions
omniops.model.name=${OMNIOPS_MODEL_NAME:}
omniops.model.api-key=${OMNIOPS_MODEL_API_KEY:}
omniops.model.max-requests=10
omniops.qwen.endpoint=${DASHSCOPE_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
omniops.qwen.model=qwen-flash
omniops.qwen.api-key=${DASHSCOPE_API_KEY:}
omniops.max-decisions=8
omniops.max-tools=12
omniops.timeout-seconds=120


# Local snapshots are opt-in. Business adapters remain simulated.
omniops.logs.mode=fixture
omniops.logs.directory=./data/logs
omniops.logs.date=2026-11-11
